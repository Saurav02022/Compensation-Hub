name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compensation_hub
          POSTGRES_PASSWORD: compensation_hub
          POSTGRES_DB: compensation_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compensation_hub -d compensation_hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The test suite never calls the LLM provider: the planner is mocked and live cases
      # are deselected by the pytest configuration. No GEMINI_API_KEY is provided here.
      TEST_DATABASE_URL: postgresql+psycopg://compensation_hub:compensation_hub@localhost:5432/compensation_hub_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
