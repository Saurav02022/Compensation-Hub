services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: compensation_hub
      POSTGRES_PASSWORD: compensation_hub
      POSTGRES_DB: compensation_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compensation_hub -d compensation_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
